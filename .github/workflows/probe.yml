name: canary

on:
  schedule:
    # GitHub cron jitter is common (5-20 min); effective cadence is "roughly
    # every 10 minutes". Public repo = free Actions minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install aioquic
        run: pip install --user aioquic

      # One-shot runs have no fail streak: a single runner-side network flap
      # would page immediately. Retry once before declaring failure.
      - name: Probe prod (riga)
        id: prod
        env:
          TT_ENDPOINT_IP: ${{ secrets.TT_ENDPOINT_IP }}
          TT_SNI_1: ${{ secrets.TT_SNI_1 }}
          TT_SNI_2: ${{ secrets.TT_SNI_2 }}
          TT_CERT_CN_EXPECTED: ${{ secrets.TT_CERT_CN_EXPECTED }}
          TT_EXPECT_HTTP_CODE: ${{ secrets.TT_EXPECT_HTTP_CODE }}
        run: bash probe_gh.sh || { sleep 8; echo "retrying once"; bash probe_gh.sh; }

      - name: Probe neth (amsterdam)
        id: neth
        if: always()
        env:
          TT_ENDPOINT_IP: ${{ secrets.TT_NETH_IP }}
          TT_SNI_1: ${{ secrets.TT_NETH_SNI_1 }}
          TT_SNI_2: ${{ secrets.TT_NETH_SNI_2 }}
          TT_CERT_CN_EXPECTED: ${{ secrets.TT_NETH_CERT_CN }}
          TT_EXPECT_HTTP_CODE: ${{ secrets.TT_NETH_EXPECT }}
        run: bash probe_gh.sh || { sleep 8; echo "retrying once"; bash probe_gh.sh; }

      - name: Probe evo (vienna)
        id: evo
        if: always()
        env:
          TT_ENDPOINT_IP: ${{ secrets.TT_EVO_IP }}
          TT_SNI_1: ${{ secrets.TT_EVO_SNI_1 }}
          TT_SNI_2: ${{ secrets.TT_EVO_SNI_2 }}
          TT_CERT_CN_EXPECTED: ${{ secrets.TT_EVO_CERT_CN }}
          TT_EXPECT_HTTP_CODE: ${{ secrets.TT_EVO_EXPECT }}
        run: bash probe_gh.sh || { sleep 8; echo "retrying once"; bash probe_gh.sh; }

      # fin1: SSH port + user's x-ui VLESS/Reality, verified by a real TLS
      # handshake with the configured serverName (CN must match: with a wrong
      # SNI Reality still falls back to the dest cert, so CN is the signal).
      - name: Probe fin1 (watcher + x-ui Reality)
        id: fin1
        if: always()
        env:
          FIN1_IP: ${{ secrets.FIN1_IP }}
          FIN1_TLS_SNI: ${{ secrets.FIN1_TLS_SNI }}
        run: |
          check() {
            timeout 6 bash -c "</dev/tcp/${FIN1_IP}/22" 2>/dev/null || return 1
            timeout 6 bash -c "</dev/tcp/${FIN1_IP}/443" 2>/dev/null || return 1
            timeout 12 openssl s_client -connect "${FIN1_IP}:443" -servername "$FIN1_TLS_SNI" </dev/null 2>/dev/null \
              | openssl x509 -noout -subject 2>/dev/null | grep -q "CN *= *${FIN1_TLS_SNI}" || return 1
          }
          check && exit 0
          sleep 8; echo "retrying once"
          check

      - name: Alert prod down
        if: steps.prod.outcome == 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s --max-time 10 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=🔴 GH-CANARY prod-riga (31.59.41.8): проба упала 2 раза подряд из сети GitHub/Azure ($(date -u +%Y-%m-%dT%H:%M:%SZ)). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

      - name: Alert neth down
        if: steps.neth.outcome == 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s --max-time 10 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=🔴 GH-CANARY neth-amsterdam (217.60.11.124): проба упала 2 раза подряд из сети GitHub/Azure ($(date -u +%Y-%m-%dT%H:%M:%SZ)). Основной рабочий VPN. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

      - name: Alert fin1 down
        if: steps.fin1.outcome == 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s --max-time 10 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=🔴 GH-CANARY fin1-watcher (45.38.139.130): TCP/22, TCP/443 или Reality-хендшейк (VLESS) не прошли из сети Azure ($(date -u +%Y-%m-%dT%H:%M:%SZ)). Если 22 жив, а Reality нет — x-ui/xray: systemctl status x-ui; journalctl -u x-ui -n 50. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

      - name: Alert evo down
        if: steps.evo.outcome == 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s --max-time 10 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=🔴 GH-CANARY evo-vienna (188.137.153.105): проба упала 2 раза подряд из сети GitHub/Azure ($(date -u +%Y-%m-%dT%H:%M:%SZ)). Новый endpoint E3 (EvolusHost AT). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
