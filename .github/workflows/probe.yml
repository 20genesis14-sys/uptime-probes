name: canary

on:
  schedule:
    # GitHub cron jitter is common (5-20 min); effective cadence is "roughly
    # every 10 minutes". Public repo = free Actions minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install aioquic
        run: pip install --user aioquic

      # One-shot runs have no fail streak: a single runner-side network flap
      # would page immediately. Retry once before declaring failure.
      - name: Probe prod (riga)
        id: prod
        env:
          TT_ENDPOINT_IP: ${{ secrets.TT_ENDPOINT_IP }}
          TT_SNI_1: ${{ secrets.TT_SNI_1 }}
          TT_SNI_2: ${{ secrets.TT_SNI_2 }}
          TT_CERT_CN_EXPECTED: ${{ secrets.TT_CERT_CN_EXPECTED }}
          TT_EXPECT_HTTP_CODE: ${{ secrets.TT_EXPECT_HTTP_CODE }}
        run: bash probe_gh.sh || { sleep 8; echo "retrying once"; bash probe_gh.sh; }

      - name: Probe neth (amsterdam)
        id: neth
        if: always()
        env:
          TT_ENDPOINT_IP: ${{ secrets.TT_NETH_IP }}
          TT_SNI_1: ${{ secrets.TT_NETH_SNI_1 }}
          TT_SNI_2: ${{ secrets.TT_NETH_SNI_2 }}
          TT_CERT_CN_EXPECTED: ${{ secrets.TT_NETH_CERT_CN }}
          TT_EXPECT_HTTP_CODE: ${{ secrets.TT_NETH_EXPECT }}
        run: bash probe_gh.sh || { sleep 8; echo "retrying once"; bash probe_gh.sh; }

      # The watcher box runs no TrustTunnel: liveness = SSH port reachable.
      - name: Probe fin1 (watcher liveness)
        id: fin1
        if: always()
        env:
          FIN1_IP: ${{ secrets.FIN1_IP }}
        run: |
          check() { timeout 6 bash -c "</dev/tcp/${FIN1_IP}/22" 2>/dev/null; }
          check && exit 0
          sleep 8; echo "retrying once"
          check

      - name: Alert prod down
        if: steps.prod.outcome == 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s --max-time 10 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=🔴 GH-CANARY prod-riga (31.59.41.8): проба упала 2 раза подряд из сети GitHub/Azure ($(date -u +%Y-%m-%dT%H:%M:%SZ)). Если VPS-сентинел молчит — проблема на пути Azure→прод. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

      - name: Alert neth down
        if: steps.neth.outcome == 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s --max-time 10 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=🔴 GH-CANARY neth-amsterdam (217.60.11.124): проба упала 2 раза подряд из сети GitHub/Azure ($(date -u +%Y-%m-%dT%H:%M:%SZ)). Основной рабочий VPN. Если VPS-сентинел молчит — проблема на пути Azure→Амстердам. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

      - name: Alert fin1 down
        if: steps.fin1.outcome == 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s --max-time 10 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=🔴 GH-CANARY fin1-watcher (45.38.139.130): сервер-наблюдатель недоступен по TCP/22 из сети Azure ($(date -u +%Y-%m-%dT%H:%M:%SZ)). VPS-сентинел ослеп — проверьте fin1 через консоль хостера. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
